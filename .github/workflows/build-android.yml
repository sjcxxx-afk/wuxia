name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --include=dev

      - name: Prebuild android project
        run: npx expo prebuild --platform android --clean

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          APP_GRADLE=android/app/build.gradle
          if [ -f android/app/build.gradle.kts ]; then
            APP_GRADLE=android/app/build.gradle.kts
          fi
          COMPILE_SDK=$(grep -oE 'compileSdk(Versions*)?[\s=]+[0-9]+' "$APP_GRADLE" | grep -oE '[0-9]+$' | head -1)
          if [ -z "$COMPILE_SDK" ]; then COMPILE_SDK=35; fi
          BUILD_TOOLS=$(grep -oE 'buildToolsVersion\s*"[^"]+"' "$APP_GRADLE" | grep -oE '[0-9.]+' | head -1)
          if [ -z "$BUILD_TOOLS" ]; then BUILD_TOOLS="${COMPILE_SDK}.0.0"; fi
          echo "compileSdk=$COMPILE_SDK buildTools=$BUILD_TOOLS"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (release, fallback to debug)
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon || {
            echo "release build failed (likely signing), falling back to debug"
            ./gradlew assembleDebug --no-daemon
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuxia-apk
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
