name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --include=dev

      # 依赖漂移会产出「装完点开即闪退」的包，所以在 prebuild/出包之前先拦下来
      - name: Check dependency matrix
        run: node scripts/check-dependency-matrix.js

      - name: Prebuild android project
        run: npx expo prebuild --platform android --clean

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          WUXIA_KEYSTORE_BASE64: ${{ secrets.WUXIA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$WUXIA_KEYSTORE_BASE64" ]; then
            echo "缺少 GitHub Secret: WUXIA_KEYSTORE_BASE64（与 CNB 密钥仓库用同一份内容）"
            exit 1
          fi
          echo "$WUXIA_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Apply release signing config
        env:
          WUXIA_KEYSTORE_FILE: ${{ github.workspace }}/apps/mobile/android/app/release.keystore
          WUXIA_KEYSTORE_PASSWORD: ${{ secrets.WUXIA_KEYSTORE_PASSWORD }}
          WUXIA_KEY_ALIAS: ${{ secrets.WUXIA_KEY_ALIAS }}
          WUXIA_KEY_PASSWORD: ${{ secrets.WUXIA_KEY_PASSWORD }}
        run: node scripts/apply-release-signing.js --require

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 不做 debug 兜底：兜底会产出与正式包签名不同的 APK，覆盖安装必然失败，
      # 这种"看起来成功"的构建比直接失败更危险。
      - name: Build APK (release, signed)
        working-directory: apps/mobile/android
        env:
          WUXIA_KEYSTORE_FILE: ${{ github.workspace }}/apps/mobile/android/app/release.keystore
          WUXIA_KEYSTORE_PASSWORD: ${{ secrets.WUXIA_KEYSTORE_PASSWORD }}
          WUXIA_KEY_ALIAS: ${{ secrets.WUXIA_KEY_ALIAS }}
          WUXIA_KEY_PASSWORD: ${{ secrets.WUXIA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --build-cache --stacktrace --no-daemon

      - name: Remove keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuxia-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
