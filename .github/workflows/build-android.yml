name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --include=dev

      - name: Prebuild android project
        run: npx expo prebuild --platform android --clean

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          # detect compileSdk / buildTools from the generated build.gradle
          $appGradle = Get-Content android/app/build.gradle -Raw
          if (Test-Path android/app/build.gradle.kts) { $appGradle = Get-Content android/app/build.gradle.kts -Raw }
          $compileSdk = [regex]::Match($appGradle, 'compileSdk\s*=?\s*(\d+)').Groups[1].Value
          if (-not $compileSdk) { $compileSdk = [regex]::Match($appGradle, 'compileSdkVersion\s*=?\s*(\d+)').Groups[1].Value }
          if (-not $compileSdk) { $compileSdk = '35' }
          $buildTools = [regex]::Match($appGradle, 'buildToolsVersion\s*=?\s*"([\d.]+)"').Groups[1].Value
          if (-not $buildTools) { $buildTools = "$compileSdk.0.0" }
          Write-Output "compileSdk=$compileSdk buildTools=$buildTools"
          sdkmanager "platform-tools" "platforms;android-$compileSdk" "build-tools;$buildTools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK (release, fallback to debug)
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon || {
            echo "release build failed (likely signing), falling back to debug"
            ./gradlew assembleDebug --no-daemon
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuxia-apk
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
